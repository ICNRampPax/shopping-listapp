<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0071e3;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 20px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
  }
  #item-input:focus {
    border-color: var(--accent);
  }
  #add-btn {
    padding: 12px 18px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #add-btn:active { opacity: 0.8; }

  .summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  #clear-checked {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }

  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .checkbox.checked::after {
    content: "";
    width: 6px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .item-text {
    flex: 1;
    font-size: 16px;
    word-break: break-word;
  }
  .item-text.checked {
    color: var(--muted);
    text-decoration: line-through;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="input-row">
      <input id="item-input" type="text" placeholder="살 물건을 입력하세요" autocomplete="off" maxlength="100">
      <button id="add-btn">추가</button>
    </div>
    <div class="summary">
      <span id="count-text">0개 항목</span>
      <button id="clear-checked">체크된 항목 삭제</button>
    </div>
    <ul id="list"></ul>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://fghkmrxamxrdvipegipt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaGttcnhhbXhyZHZpcGVnaXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjcxNTIsImV4cCI6MjEwNTMwMzE1Mn0.f0mhj5UpQ40VovHBeX_DsYUgbnjW2ezwrSAWBAs76yc";
  const TABLE = "shopping_items";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const input = document.getElementById("item-input");
  const addBtn = document.getElementById("add-btn");
  const list = document.getElementById("list");
  const countText = document.getElementById("count-text");
  const clearCheckedBtn = document.getElementById("clear-checked");

  let items = [];

  async function loadItems() {
    const { data, error } = await client
      .from(TABLE)
      .select("*")
      .order("created_at", { ascending: true });
    if (error) {
      console.error(error);
      countText.textContent = "불러오기 실패";
      return;
    }
    items = data;
    render();
  }

  function render() {
    list.innerHTML = "";

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "리스트가 비어 있습니다. 항목을 추가해보세요.";
      empty.style.border = "none";
      list.appendChild(empty);
    } else {
      items.forEach((item) => {
        const li = document.createElement("li");

        const checkbox = document.createElement("div");
        checkbox.className = "checkbox" + (item.checked ? " checked" : "");
        checkbox.addEventListener("click", () => toggleItem(item.id));

        const text = document.createElement("span");
        text.className = "item-text" + (item.checked ? " checked" : "");
        text.textContent = item.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "✕";
        deleteBtn.setAttribute("aria-label", "삭제");
        deleteBtn.addEventListener("click", () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    const checkedCount = items.filter((i) => i.checked).length;
    countText.textContent = `${items.length}개 항목 · ${checkedCount}개 체크됨`;
  }

  async function addItem() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const { data, error } = await client
      .from(TABLE)
      .insert({ text, checked: false })
      .select()
      .single();
    if (error) {
      console.error(error);
      return;
    }
    items.push(data);
    render();
    input.focus();
  }

  async function toggleItem(id) {
    const item = items.find((i) => i.id === id);
    if (!item) return;
    const nextChecked = !item.checked;
    item.checked = nextChecked;
    render();
    const { error } = await client.from(TABLE).update({ checked: nextChecked }).eq("id", id);
    if (error) {
      console.error(error);
      item.checked = !nextChecked;
      render();
    }
  }

  async function deleteItem(id) {
    const prevItems = items;
    items = items.filter((i) => i.id !== id);
    render();
    const { error } = await client.from(TABLE).delete().eq("id", id);
    if (error) {
      console.error(error);
      items = prevItems;
      render();
    }
  }

  async function clearChecked() {
    const prevItems = items;
    items = items.filter((i) => !i.checked);
    render();
    const { error } = await client.from(TABLE).delete().eq("checked", true);
    if (error) {
      console.error(error);
      items = prevItems;
      render();
    }
  }

  addBtn.addEventListener("click", addItem);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });
  clearCheckedBtn.addEventListener("click", clearChecked);

  loadItems();
})();
</script>
</body>
</html>
